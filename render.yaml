services:
  - type: web
    name: lukas-university
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: npm install && cd client && npm install && cd .. && npm run build
    startCommand: node server/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: JWT_SECRET
        generateValue: true
      - key: BCRYPT_ROUNDS
        value: "10"
      - key: DATABASE_URL
        value: /opt/render/project/src/data/lukas.db
      # Nastavit ručně v Render dashboardu (nejsou v repozitáři):
      - key: BOOTSTRAP_USERS
        sync: false
      - key: INITIAL_PASSWORD
        sync: false
    disk:
      name: lukas-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
